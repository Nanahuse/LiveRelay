[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liverelay"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Relay Twitch and YouTube live streams to an NDI source"
requires-python = ">=3.14"
dependencies = [
    "streamlink>=7.0",
    "PyGObject>=3.50; sys_platform != 'win32'",
    "gstreamer-python==1.28.6; sys_platform == 'win32'",
]

[project.scripts]
liverelay = "ui:main"
liverelay-cli = "main:main"

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["controller", "main", "stream_source", "stream_url", "ui"]
