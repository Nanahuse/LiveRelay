[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-to-ndi"
version = "0.1.0"
description = "Relay a Twitch live stream to an NDI source"
requires-python = ">=3.14"
dependencies = ["streamlink>=7.0"]

[project.scripts]
twitch-to-ndi = "twitch_to_ndi.main:main"

[tool.setuptools.packages.find]
where = ["src"]
