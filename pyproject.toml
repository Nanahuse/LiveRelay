[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-to-ndi"
version = "0.1.0"
description = "Relay a Twitch live stream to an NDI source"
requires-python = ">=3.14"
dependencies = [
    "streamlink>=7.0",
    "PyGObject>=3.50; sys_platform != 'win32'",
    "gstreamer-python==1.28.6; sys_platform == 'win32'",
]

[project.scripts]
liverelay = "ui:main"
liverelay-cli = "main:main"
twitch-to-ndi = "ui:main"
twitch-to-ndi-cli = "main:main"

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["controller", "main", "ui"]
