[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-to-ndi"
version = "0.1.0"
description = "Relay a Twitch live stream to an NDI source"
requires-python = ">=3.14"
dependencies = [
    "streamlink>=7.0",
    "PyGObject>=3.50; sys_platform != 'win32'",
    "gstreamer-python==1.28.6; sys_platform == 'win32'",
]

[project.scripts]
twitch-to-ndi = "twitch_to_ndi.ui:main"
twitch-to-ndi-cli = "twitch_to_ndi.main:main"

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]

[tool.setuptools.packages.find]
where = ["src"]
